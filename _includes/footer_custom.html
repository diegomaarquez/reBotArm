{% assign modified =
  page.last_modified_at
  | default: page.last_modified
  | default: page.date
  | default: site.time %}

<footer class="custom-footer" role="contentinfo">
  <p class="custom-footer__copy">
    Copyright &copy; 2026 IBERO. 
    <a href="https://www.linkedin.com/in/hubergiron/" rel="license noopener" target="_blank">Huber Giron</a>.
    This work is licensed under
    <a href="https://creativecommons.org/licenses/by/4.0/" rel="license noopener" target="_blank">CC BY 4.0</a>.
  </p>

  <p class="custom-footer__modified">
    <strong>Last modified:</strong>
    {{ modified | date: "%A, %B %-d, %Y at %H:%M" }}
  </p>

</footer>

<dialog class="site-image-lightbox" data-image-lightbox aria-label="Imagen ampliada">
  <button class="site-image-lightbox__close" type="button" data-lightbox-close aria-label="Cerrar imagen" title="Cerrar">×</button>
  <button class="site-image-lightbox__previous" type="button" data-lightbox-previous aria-label="Imagen anterior" title="Anterior">←</button>
  <img data-lightbox-image alt="">
  <button class="site-image-lightbox__next" type="button" data-lightbox-next aria-label="Imagen siguiente" title="Siguiente">→</button>
  <p data-lightbox-caption></p>
  <span class="site-image-lightbox__count" data-lightbox-count aria-live="polite"></span>
</dialog>

<script src="{{ '/assets/js/robot-arm-lightbox.js' | relative_url }}?v=2" defer></script>
